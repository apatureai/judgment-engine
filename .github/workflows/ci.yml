name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/build

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo contents.
permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (warnings fail the build)
        run: pnpm lint

      - name: Typecheck (all packages via project references)
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  release-gate:
    # #155: the promotion gate itself is exercised on every build — a passing
    # candidate must exit 0 and a deliberately regressed candidate must be
    # BLOCKED. If either behavior drifts, no promotion decision can be trusted,
    # so this fails the build.
    name: release gate · promote pass · block regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eval package
        run: pnpm --filter @engine/eval... build

      - name: Gate promotes the passing candidate
        run: node packages/eval/dist/release-gate-cli.js packages/eval/fixtures/release/passing.advisory.json

      - name: Gate blocks the deliberately regressed candidate
        run: |
          if node packages/eval/dist/release-gate-cli.js packages/eval/fixtures/release/regressed.blocked.json; then
            echo "release gate PROMOTED a regressed candidate — the gate is broken"
            exit 1
          fi

  python:
    name: python · pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - python/preference-dataset
          - python/eval
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"

      - name: Create virtualenv
        run: uv venv
        working-directory: ${{ matrix.package }}

      - name: Install package (with dev extras)
        run: uv pip install -e '.[dev]'
        working-directory: ${{ matrix.package }}

      - name: Test
        run: uv run pytest
        working-directory: ${{ matrix.package }}

  rust:
    name: rust · capture-dedup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Test
        run: cargo test --manifest-path rust/capture-dedup/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path rust/capture-dedup/Cargo.toml --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --manifest-path rust/capture-dedup/Cargo.toml --check

  container:
    name: production image · smoke · SBOM · scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image
        run: docker build --pull --tag apature-judgment-engine:ci --file Dockerfile .

      - name: Verify migration, Node 24, liveness, readiness, and graceful shutdown
        run: scripts/ci/container-smoke.sh apature-judgment-engine:ci

      - name: Generate image SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: apature-judgment-engine:ci
          artifact-name: judgment-engine-image.spdx.json
          output-file: judgment-engine-image.spdx.json
          format: spdx-json
          upload-release-assets: false

      - name: Scan production image
        id: scan
        continue-on-error: true
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: apature-judgment-engine:ci
          output-format: json
          output-file: judgment-engine-image.grype.json
          fail-build: true
          severity-cutoff: high
          only-fixed: true

      - name: Retain vulnerability evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: judgment-engine-image-vulnerability-report
          path: judgment-engine-image.grype.json
          if-no-files-found: error
          retention-days: 30

      - name: Enforce image vulnerability gate
        if: always()
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: test "$SCAN_OUTCOME" = success
