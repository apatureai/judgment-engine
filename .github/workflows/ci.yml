name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - agent/build

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo contents.
permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (warnings fail the build)
        run: pnpm lint

      - name: Typecheck (all packages via project references)
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  python:
    name: python · pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - python/preference-dataset
          - python/eval
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Create virtualenv
        run: uv venv
        working-directory: ${{ matrix.package }}

      - name: Install package (with dev extras)
        run: uv pip install -e '.[dev]'
        working-directory: ${{ matrix.package }}

      - name: Test
        run: uv run pytest
        working-directory: ${{ matrix.package }}

  rust:
    name: rust · capture-dedup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Test
        run: cargo test --manifest-path rust/capture-dedup/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path rust/capture-dedup/Cargo.toml --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --manifest-path rust/capture-dedup/Cargo.toml --check
