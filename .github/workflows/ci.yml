name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: CI only needs to read the repo contents.
permissions:
  contents: read

jobs:
  build:
    name: lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (warnings fail the build)
        run: pnpm lint

      - name: Typecheck (all packages via project references)
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  quickstart:
    # The README's quickstart, run for real: a headless Chromium captures the
    # bundled demo site, and the grounding gate deletes the two deliberately
    # ungrounded findings in the canned script. If this drifts, the README is
    # lying, so it fails the build.
    name: quickstart · real capture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The command the README tells a reader to run; `--with-deps` adds the
      # system libraries a bare CI image lacks.
      - name: Install Chromium
        run: pnpm browser:install --with-deps

      # The deterministic contrast facts are published as measurements, so the
      # extractor is checked against what a real Chromium reports — the one seam
      # the fake-browser unit tests cannot cover.
      - name: DOM extractor against a real Chromium
        run: node scripts/ci/extractor-smoke.mjs

      - name: Run the quickstart
        run: |
          set -euo pipefail
          pnpm review | tee quickstart.txt

      # The offline run replays a fixture, so the report must not present a
      # grade for a page nothing looked at. This is the assertion that keeps
      # that promise from regressing.
      - name: Assert the offline run reports no grade
        run: |
          set -euo pipefail
          grep -q "grade       n/a (canned client, no model saw this page)" quickstart.txt
          grep -q "FIXTURE TEXT: replayed from the canned client" quickstart.txt
          if grep -qE "^  grade *(ship|needs_work|block)" quickstart.txt; then
            echo "a canned run printed a grade"
            exit 1
          fi

      - name: Assert the artifacts the README promises
        run: |
          set -euo pipefail
          test -f out/review.json
          test -f out/system-prompt.txt
          test -f out/geometry.json
          test -f out/deterministic-facts.txt
          test -f out/screenshots/index/desktop.png
          test "$(node -e 'process.stdout.write(String(require("./out/review.json").findings.length))')" = "3"
          grep -q "GROUNDING RULES (mandatory):" out/system-prompt.txt
          grep -q "INSTRUCTION HIERARCHY" out/system-prompt.txt
          if grep -qE "pricing-table|/checkout" out/review.json; then
            echo "ungrounded findings survived the drop-and-count gate"
            exit 1
          fi

  release-gate:
    # #155: the promotion gate itself is exercised on every build — a passing
    # candidate must exit 0 and a deliberately regressed candidate must be
    # BLOCKED. If either behavior drifts, no promotion decision can be trusted,
    # so this fails the build.
    name: release gate · promote pass · block regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build eval package
        run: pnpm --filter @engine/eval... build

      - name: Gate promotes the passing candidate
        run: node packages/eval/dist/release-gate-cli.js packages/eval/fixtures/release/passing.advisory.json

      - name: Gate blocks the deliberately regressed candidate
        run: |
          if node packages/eval/dist/release-gate-cli.js packages/eval/fixtures/release/regressed.blocked.json; then
            echo "release gate PROMOTED a regressed candidate — the gate is broken"
            exit 1
          fi

  python:
    name: python · pytest
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - python/preference-dataset
          - python/eval
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: "3.11"

      - name: Create virtualenv
        run: uv venv
        working-directory: ${{ matrix.package }}

      - name: Install package (with dev extras)
        run: uv pip install -e '.[dev]'
        working-directory: ${{ matrix.package }}

      - name: Test
        run: uv run pytest
        working-directory: ${{ matrix.package }}

  rust:
    name: rust · capture-dedup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - name: Test
        run: cargo test --manifest-path rust/capture-dedup/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path rust/capture-dedup/Cargo.toml --all-targets -- -D warnings

      - name: Format
        run: cargo fmt --manifest-path rust/capture-dedup/Cargo.toml --check

  container:
    name: production image · smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build production image
        run: docker build --pull --tag apature-judgment-engine:ci --file Dockerfile .

      - name: Verify migration, Node 24, liveness, readiness, and graceful shutdown
        run: scripts/ci/container-smoke.sh apature-judgment-engine:ci
