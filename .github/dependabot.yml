version: 2
updates:
  # Root pnpm workspace (all @engine/* packages share the single lockfile).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Python ML/eval packages (uv/pyproject, covered by the python CI job).
  - package-ecosystem: pip
    directory: "/python/preference-dataset"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
  - package-ecosystem: pip
    directory: "/python/eval"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
